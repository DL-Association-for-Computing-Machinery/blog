services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: association_blog
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blog_local_password}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d association_blog"]
      interval: 5s
      timeout: 3s
      retries: 15
  # Single-node development object store. Use an actual distributed S3 cluster in production.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-blog_storage}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-blog_storage_local_password}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["media_data:/data"]
  storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-blog_storage}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-blog_storage_local_password}
    entrypoint: /bin/sh
    command: >-
      -c 'until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do sleep 2; done;
      mc mb --ignore-existing local/blog-media && mc anonymous set download local/blog-media'
volumes:
  postgres_data:
  media_data:
