# Four MinIO processes and eight volumes for local distributed-mode validation.
# Real fault tolerance requires separate hosts/disks; four containers on one host
# do not survive that host failing. Do not run alongside the standalone MinIO.
name: ecut-blog-storage-cluster
x-minio: &minio
  image: minio/minio:RELEASE.2025-04-22T22-12-26Z
  command: server --console-address ":9001" http://minio{1...4}/data{1...2}
  restart: unless-stopped
  environment:
    MINIO_ROOT_USER: ${S3_ACCESS_KEY:-blog_storage}
    MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-blog_storage_local_password}
services:
  minio1:
    <<: *minio
    volumes: ["media_1a:/data1", "media_1b:/data2"]
  minio2:
    <<: *minio
    volumes: ["media_2a:/data1", "media_2b:/data2"]
  minio3:
    <<: *minio
    volumes: ["media_3a:/data1", "media_3b:/data2"]
  minio4:
    <<: *minio
    volumes: ["media_4a:/data1", "media_4b:/data2"]
  storage-gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on: [minio1, minio2, minio3, minio4]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["./storage-nginx.conf:/etc/nginx/nginx.conf:ro"]
  storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [storage-gateway]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-blog_storage}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-blog_storage_local_password}
    entrypoint: /bin/sh
    command: >-
      -c 'until mc alias set cluster http://storage-gateway:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do sleep 2; done;
      mc mb --ignore-existing cluster/blog-media && mc anonymous set download cluster/blog-media'
volumes:
  media_1a:
  media_1b:
  media_2a:
  media_2b:
  media_3a:
  media_3b:
  media_4a:
  media_4b:
